# compose.yaml — Docker Compose로 띄울 서비스 목록
# 3단계: PostgreSQL, 6단계: Redis를 먼저 띄운다. 11단계에서 django·fastapi·celery를 더해 5개로 늘린다.
# 실행 (프로젝트 맨 위 폴더에서):  docker compose up -d postgres redis
# 상태 확인:                      docker compose ps

services:
  postgres:
    image: postgres:17                      # PostgreSQL 공식 이미지 (17번대)
    environment:                            # .env의 값으로 DB·계정을 처음 한 번 만든다
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"                         # 내 PC의 5432 → 컨테이너의 5432 (Django를 PC에서 돌리는 동안 필요)
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터가 남는 저장 공간 (T10)
    healthcheck:                            # DB가 접속을 받을 준비가 됐는지 스스로 검사
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:                                    # 6단계: Celery 작업 대기열(브로커)
    image: redis:8                          # Redis 공식 이미지 (8번대)
    ports:
      - "6379:6379"                         # 내 PC의 6379 → 컨테이너의 6379 (Django·Worker를 PC에서 돌리는 동안 필요)
    healthcheck:                            # 'PING'에 'PONG'으로 답하면 준비 완료
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 볼륨 없음: Redis에는 잠깐 머무는 쪽지만 둔다. 오래 남길 결과는 PostgreSQL에 저장한다

volumes:
  postgres_data:
